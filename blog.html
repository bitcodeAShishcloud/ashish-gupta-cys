<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Ashish Gupta</title>
    <meta name="description" content="Cybersecurity insights, tutorials, and guides by Ashish Gupta.">
    <meta name="author" content="Ashish Gupta">

    <link rel="icon" type="image/webp" href="favicon.webp">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="blog.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="blog-page">
    <div class="page-bg-wrapper" aria-hidden="true">
        <div class="page-bg-glow"></div>
        <div class="page-bg-grid"></div>
        <div class="page-bg-scanline"></div>
    </div>

    <div class="reading-progress" id="readingProgress"></div>

    <nav class="navbar" role="navigation" aria-label="Blog navigation">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html"><h2>Ashish Gupta</h2></a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html#about" class="nav-link">About</a></li>
                <li class="nav-item"><a href="index.html#skills" class="nav-link">Skills</a></li>
                <li class="nav-item"><a href="index.html#projects" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="index.html#gallery" class="nav-link">Gallery</a></li>
                <li class="nav-item"><a href="blog.html" class="nav-link nav-link--current">Blog</a></li>
                <li class="nav-item"><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger" aria-label="Toggle mobile menu" role="button" tabindex="0">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="site-shell">
    <div id="listingView">
        <header class="blog-hero">
            <h1>Blog</h1>
            <p>Thoughts, tutorials, and insights on cybersecurity, networking, and software development.</p>
        </header>

        <!-- Search & Filters -->
        <div class="blog-controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" class="input-field" placeholder="Search articles…">
            </div>
            <div class="filter-tags" id="filterTags">
                <button class="filter-tag active" data-category="all">All</button>
                <!-- JS will populate remaining categories -->
            </div>
        </div>

        <!-- Cards -->
        <div class="blog-grid" id="blogGrid"></div>
    </div>

    <!-- ════════════════════ READER VIEW ════════════════════ -->
    <div class="reader-view" id="readerView">
        <a href="#" class="reader-back" id="backToList">
            <i class="fas fa-arrow-left"></i> Back to articles
        </a>
        <span class="reader-category" id="readerCategory"></span>
        <h1 class="reader-title" id="readerTitle"></h1>
        <div class="reader-meta" id="readerMeta"></div>
        <img class="reader-hero-img" id="readerHeroImg" src="" alt="" style="display:none;">
        <div class="article-body" id="readerBody"></div>

        <div class="share-row">
            <span>Share</span>
            <a class="share-btn" id="shareTwitter" href="#" target="_blank" rel="noopener" title="Share on Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a class="share-btn" id="shareLinkedIn" href="#" target="_blank" rel="noopener" title="Share on LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <button class="share-btn" id="shareCopy" title="Copy link">
                <i class="fas fa-link"></i>
            </button>
        </div>
    </div>

    <footer class="blog-footer">
        <p>&copy; 2025 <a href="index.html">Ashish Gupta</a>. All rights reserved.</p>
    </footer>
    </div><!-- /.site-shell -->

    <!-- Data -->
    <script src="blog-data.js"></script>

    <script>
    (function () {
        /* ─── DOM refs ─── */
        const listingView   = document.getElementById('listingView');
        const readerView    = document.getElementById('readerView');
        const blogGrid      = document.getElementById('blogGrid');
        const searchInput   = document.getElementById('searchInput');
        const filterTags    = document.getElementById('filterTags');
        const progressBar   = document.getElementById('readingProgress');

        let activeCategory = 'all';

        /* ─── Populate category filters ─── */
        const categories = [...new Set(BLOG_POSTS.map(p => p.category))];
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-tag';
            btn.dataset.category = cat;
            btn.textContent = cat;
            filterTags.appendChild(btn);
        });

        /* ─── Filter tag clicks ─── */
        filterTags.addEventListener('click', e => {
            if (!e.target.classList.contains('filter-tag')) return;
            filterTags.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            activeCategory = e.target.dataset.category;
            renderCards();
        });

        /* ─── Search ─── */
        searchInput.addEventListener('input', () => renderCards());

        /* ─── Render cards ─── */
        function renderCards() {
            const query = searchInput.value.toLowerCase().trim();

            const filtered = BLOG_POSTS.filter(post => {
                const matchesCat = activeCategory === 'all' || post.category === activeCategory;
                const matchesQuery = !query ||
                    post.title.toLowerCase().includes(query) ||
                    post.excerpt.toLowerCase().includes(query) ||
                    post.tags.some(t => t.toLowerCase().includes(query));
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                blogGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>No articles found. Try a different search or filter.</p>
                    </div>`;
                return;
            }

            blogGrid.innerHTML = filtered.map(post => `
                <article class="blog-card glass-panel" data-id="${post.id}">
                    ${post.image ? `<img class="card-image" src="${post.image}" alt="${post.title}" loading="lazy">` : ''}
                    <div class="card-body">
                        <span class="card-category">${post.category}</span>
                        <h2 class="card-title">${post.title}</h2>
                        <p class="card-excerpt">${post.excerpt}</p>
                        <div class="card-meta">
                            <span><i class="fas fa-calendar-alt"></i> ${formatDate(post.date)}</span>
                            <span><i class="fas fa-clock"></i> ${post.readTime}</span>
                        </div>
                        <div class="card-tags">
                            ${post.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                </article>
            `).join('');

            /* attach click handlers */
            blogGrid.querySelectorAll('.blog-card').forEach(card => {
                card.addEventListener('click', () => openPost(card.dataset.id));
            });
        }

        /* ─── Open post ─── */
        function openPost(id) {
            const post = BLOG_POSTS.find(p => p.id === id);
            if (!post) return;

            /* update URL */
            history.pushState({ post: id }, '', `blog.html?post=${id}`);

            showReaderView(post);
        }

        function showReaderView(post) {
            /* populate */
            document.getElementById('readerCategory').textContent = post.category;
            document.getElementById('readerTitle').textContent = post.title;
            document.getElementById('readerMeta').innerHTML = `
                <span><i class="fas fa-user"></i> ${post.author}</span>
                <span><i class="fas fa-calendar-alt"></i> ${formatDate(post.date)}</span>
                <span><i class="fas fa-clock"></i> ${post.readTime}</span>
            `;
            document.getElementById('readerBody').innerHTML = post.content;
            document.title = post.title + ' — Ashish Gupta';

            /* hero image */
            const heroImg = document.getElementById('readerHeroImg');
            if (post.image) {
                heroImg.src = post.image;
                heroImg.alt = post.title;
                heroImg.style.display = 'block';
            } else {
                heroImg.style.display = 'none';
            }

            /* share links */
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(post.title);
            document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?url=${url}&text=${title}`;
            document.getElementById('shareLinkedIn').href = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
            document.getElementById('shareCopy').onclick = () => {
                navigator.clipboard.writeText(window.location.href);
                const icon = document.querySelector('#shareCopy i');
                icon.className = 'fas fa-check';
                setTimeout(() => icon.className = 'fas fa-link', 1500);
            };

            /* toggle views */
            listingView.style.display = 'none';
            readerView.style.display = 'block';
            progressBar.style.display = 'block';
            window.scrollTo({ top: 0 });
        }

        /* ─── Back to list ─── */
        document.getElementById('backToList').addEventListener('click', e => {
            e.preventDefault();
            history.pushState({}, '', 'blog.html');
            showListingView();
        });

        function showListingView() {
            readerView.style.display = 'none';
            listingView.style.display = 'block';
            progressBar.style.display = 'none';
            document.title = 'Blog - Ashish Gupta';
            window.scrollTo({ top: 0 });
        }

        /* ─── Handle browser back/forward ─── */
        window.addEventListener('popstate', () => route());

        /* ─── Reading progress ─── */
        window.addEventListener('scroll', () => {
            if (readerView.style.display !== 'block') return;
            const scrolled = window.scrollY;
            const height = document.documentElement.scrollHeight - window.innerHeight;
            const pct = height > 0 ? (scrolled / height) * 100 : 0;
            progressBar.style.width = pct + '%';
        });

        /* ─── Helpers ─── */
        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        /* ─── Router ─── */
        function route() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('post');

            if (postId) {
                const post = BLOG_POSTS.find(p => p.id === postId);
                if (post) { showReaderView(post); return; }
            }
            showListingView();
            renderCards();
        }

        /* ─── Init ─── */
        route();

        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        if (hamburger && navMenu) {
            const toggleNav = () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            };
            hamburger.addEventListener('click', toggleNav);
            hamburger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleNav();
                }
            });
            navMenu.querySelectorAll('.nav-link').forEach((link) => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                });
            });
        }
    })();
    </script>
</body>
</html>
