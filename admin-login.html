<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00f0ff;
            --secondary-color: #00ff00;
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --font-heading: 'Courier New', Courier, monospace;
            --font-body: 'Inter', -apple-system, sans-serif;
            --border-color: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: radial-gradient(circle at 50% 0%, #111827 0%, #000000 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .login-container {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            max-width: 480px;
            width: 100%;
            padding: 3.5rem 3rem;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-icon {
            width: 90px;
            height: 90px;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.75rem;
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            position: relative;
        }

        .login-icon::before {
            content: '';
            position: absolute;
            width: 110px;
            height: 110px;
            background: rgba(0, 240, 255, 0.1);
            border-radius: 50%;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0; }
        }

        .login-icon i {
            font-size: 2.75rem;
            color: var(--primary-color);
            position: relative;
            z-index: 1;
        }

        .login-header h1 {
            font-size: 2.25rem;
            color: var(--primary-color);
            margin-bottom: 0.625rem;
            font-family: var(--font-heading);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-weight: 700;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-family: var(--font-heading);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.625rem;
            font-weight: 500;
            color: #e5e7eb;
            font-family: var(--font-heading);
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper::before {
            content: '>';
            position: absolute;
            left: 14px;
            color: var(--secondary-color);
            font-family: var(--font-heading);
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrapper i.fa-user,
        .input-wrapper i.fa-lock,
        .input-wrapper i.fa-robot {
            display: none;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 30px;
            border: 1px solid var(--secondary-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: var(--font-heading);
            background: transparent;
            color: var(--secondary-color);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            background: rgba(0, 255, 0, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(0, 255, 0, 0.3);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--secondary-color);
            transition: all 0.3s ease;
            font-size: 1.15rem;
            z-index: 10;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .toggle-password:hover {
            color: var(--primary-color);
            background: rgba(0, 240, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 1.125rem;
            background: transparent;
            color: var(--secondary-color);
            border: 1px solid var(--secondary-color);
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: var(--font-heading);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            margin-top: 0.5rem;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .btn-login:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4), inset 0 0 15px rgba(0, 255, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            box-shadow: none;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.1);
            color: #ff3333;
            padding: 1rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
            display: none;
            font-size: 0.95rem;
            border: 1px solid #ff3333;
            font-family: var(--font-heading);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 1.75rem;
            color: var(--primary-color);
            text-decoration: none;
            font-family: var(--font-heading);
            transition: all 0.3s ease;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            background: rgba(0, 240, 255, 0.05);
            width: 100%;
            border: 1px solid transparent;
        }

        .back-link:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .btn-refresh {
            background: none;
            border: 1px solid var(--secondary-color);
            color: var(--secondary-color);
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s ease;
            width: 36px;
            height: 36px;
        }
        .btn-refresh:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .captcha-box {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            align-items: center;
            background: rgba(0, 255, 0, 0.05);
            border: 1px dashed var(--secondary-color);
            padding: 0.625rem;
            border-radius: 6px;
        }
        .captcha-box span {
            color: var(--secondary-color);
        }

        .input-wrapper input:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--secondary-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .loading-spinner { display: block; }
        .btn-login.loading .btn-text { display: none; }
        
        @keyframes pulseLockout {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Admin Login</h1>
            <p>Enter your credentials to access admin panel</p>
        </div>

        <!-- Dynamic Security Lockout Banner -->
        <div class="lockout-banner" id="lockoutBanner" style="display: none; background: rgba(255, 0, 0, 0.1); border: 1px solid #ff3333; border-radius: 6px; padding: 1.5rem 1rem; margin-bottom: 1.5rem; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; text-align: center; color: #ff3333; font-weight: 600; font-family: 'Courier New', Courier, monospace;">
            <div style="font-size: 2.25rem; color: #ff3333; animation: pulseLockout 1.5s infinite;"><i class="fas fa-user-lock"></i></div>
            <div style="font-size: 1.15rem; font-weight: 700; margin-top: -0.25rem; text-transform: uppercase;">Security Lockout Active</div>
            <p style="font-size: 0.9rem; color: #cc0000; margin: 0; font-weight: 500; line-height: 1.4;">Too many failed login attempts. To prevent brute force attacks, access has been restricted temporarily.</p>
            <div style="background: rgba(255, 0, 0, 0.2); border: 1px dashed #ff3333; padding: 0.5rem 1.25rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.25rem; color: #ff3333; font-weight: 700; margin-top: 0.25rem;">
                <i class="fas fa-hourglass-half"></i> <span id="lockoutTimerText">15:00</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">user@admin:~/username_input$</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="[ Enter your username ]" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">user@admin:~/password_input$</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="[ Enter your password ]" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <!-- Visual Security Math Captcha to Block Scripted Brute-Forcing -->
            <div class="form-group" id="captchaContainer">
                <label for="captchaInput">user@admin:~/security_captcha$</label>
                <div class="captcha-box">
                    <span style="font-weight: 700; font-size: 1.1rem; padding: 0 0.5rem; letter-spacing: 2px; user-select: none; font-family: 'Courier New', Courier, monospace;" id="captchaQuestion">Generating...</span>
                    <button type="button" id="refreshCaptcha" class="btn-refresh" title="Refresh Captcha">
                        <i class="fas fa-redo"></i>
                    </button>
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-robot"></i>
                    <input type="text" id="captchaInput" placeholder="[ Enter calculated result ]" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i> Login
                </span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
        </a>
    </div>

    <script src="admin-auth.js"></script>
</body>
</html>
