<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Portfolio</title>
    <link rel="icon" type="image/webp" href="favicon.webp">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="admin-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-bg-wrapper" aria-hidden="true">
        <div class="page-bg-glow"></div>
        <div class="page-bg-grid"></div>
        <div class="page-bg-scanline"></div>
    </div>
    <div class="login-container glass-panel">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Admin Login</h1>
            <p>Enter your credentials to access admin panel</p>
        </div>

        <!-- Dynamic Security Lockout Banner -->
        <div class="lockout-banner" id="lockoutBanner" style="display: none; background: rgba(255, 0, 0, 0.1); border: 1px solid #ff3333; border-radius: 6px; padding: 1.5rem 1rem; margin-bottom: 1.5rem; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; text-align: center; color: #ff3333; font-weight: 600; font-family: 'Courier New', Courier, monospace;">
            <div style="font-size: 2.25rem; color: #ff3333; animation: pulseLockout 1.5s infinite;"><i class="fas fa-user-lock"></i></div>
            <div style="font-size: 1.15rem; font-weight: 700; margin-top: -0.25rem; text-transform: uppercase;">Security Lockout Active</div>
            <p style="font-size: 0.9rem; color: #cc0000; margin: 0; font-weight: 500; line-height: 1.4;">Too many failed login attempts. To prevent brute force attacks, access has been restricted temporarily.</p>
            <div style="background: rgba(255, 0, 0, 0.2); border: 1px dashed #ff3333; padding: 0.5rem 1.25rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.25rem; color: #ff3333; font-weight: 700; margin-top: 0.25rem;">
                <i class="fas fa-hourglass-half"></i> <span id="lockoutTimerText">15:00</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">user@admin:~/username_input$</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="[ Enter your username ]" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">user@admin:~/password_input$</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="[ Enter your password ]" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <!-- Visual Security Math Captcha to Block Scripted Brute-Forcing -->
            <div class="form-group" id="captchaContainer">
                <label for="captchaInput">user@admin:~/security_captcha$</label>
                <div class="captcha-box">
                    <span style="font-weight: 700; font-size: 1.1rem; padding: 0 0.5rem; letter-spacing: 2px; user-select: none; font-family: 'Courier New', Courier, monospace;" id="captchaQuestion">Generating...</span>
                    <button type="button" id="refreshCaptcha" class="btn-refresh" title="Refresh Captcha">
                        <i class="fas fa-redo"></i>
                    </button>
                </div>
                <div class="input-wrapper">
                    <i class="fas fa-robot"></i>
                    <input type="text" id="captchaInput" placeholder="[ Enter calculated result ]" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i> Login
                </span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
        </a>
    </div>

    <script src="admin-auth.js"></script>
</body>
</html>
